# The automated reviewer, in shadow mode. It reviews each proposal soon after it is submitted, records what the models
# said, and changes nothing. See docs/SPEC.md.
#
# Three jobs, so that nothing which can ask a model can write, and nothing which can write holds a model key:
#   find     a quick look, with no model key: is there a proposal to review, or a decision to record?
#   review   reads GitHub and asks the models. It can write nowhere. Its results are saved as a file.
#   publish  holds no model key. It checks the saved results and writes them to the log, then rebuilds the scoreboard.
#
# There is no issue trigger on purpose: nothing an outsider does starts a run directly. A run starts on the clock.
name: Automated reviewer

on:
  # The schedule is the last step of the build. Until then a run is started by hand. When it is on, a run starts every
  # hour, and the review job is skipped unless the quick look finds something to do.
  # schedule:
  #   - cron: "17 * * * *"
  #   - cron: "47 3 * * *"   # once a day the scoreboard is rebuilt even with nothing to do, so its date shows the clock is alive
  workflow_dispatch:
    inputs:
      mode:
        description: "reconcile: review what is outstanding, then rebuild the scoreboard. fixtures: run the made-up test submissions. scoreboard: rebuild it only."
        type: choice
        options: [reconcile, fixtures, scoreboard]
        default: reconcile
      numbers:
        description: "Proposal numbers, to narrow a reconcile run (they can never widen it; fixture mode ignores them)"
        type: string
        required: false
      override_caps:
        description: "Lift the limits for this run (never the kill switch)"
        type: boolean
        default: false

# No permission unless a job asks for it.
permissions: {}

# One run at a time, and a run that has started is never cancelled part-way.
concurrency:
  group: automated-reviewer
  cancel-in-progress: false

jobs:
  find:
    # Forks never run it.
    if: github.repository == 'OpenIslet/automated-reviewer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read   # the log is an issue in this repository; needed while the repository is private
    outputs:
      work: ${{ steps.look.outputs.work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned dependencies
        run: python -m pip install --require-hashes -r settings/requirements.lock
      - name: Look for work
        id: look
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATED_REVIEWER_ENABLED: ${{ vars.AUTOMATED_REVIEWER_ENABLED }}
          REVIEWER_NUMBERS: ${{ inputs.numbers }}
        run: python scripts/automated_reviewer.py pending

  review:
    # On the clock, only when there is something to do, so that an empty hour asks no model and holds no key.
    # A run started by hand always goes ahead, unless it asked for the scoreboard alone.
    needs: find
    if: github.repository == 'OpenIslet/automated-reviewer' && inputs.mode != 'scoreboard' && (needs.find.outputs.work == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: automated-reviewer
    permissions:
      contents: read
      issues: read   # to read the log; this job can write nowhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned dependencies
        run: python -m pip install --require-hashes -r settings/requirements.lock
      - name: Review
        # Inputs reach the script as environment variables, never inside a command.
        # The model keys belong in this step's environment and nowhere else. A provider is asked only when its key
        # line is here. A model whose provider has no key line is recorded as waiting.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATED_REVIEWER_ENABLED: ${{ vars.AUTOMATED_REVIEWER_ENABLED }}
          REVIEWER_NUMBERS: ${{ inputs.numbers }}
          REVIEWER_OVERRIDE_CAPS: ${{ inputs.override_caps }}
          REVIEWER_MODE: ${{ inputs.mode }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/automated_reviewer.py review --out results.json
      - name: Keep the results, whatever happened
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: results.json
          if-no-files-found: ignore
          retention-days: 30

  publish:
    # Runs even if the review failed part-way, so that what was already done is not lost.
    needs: [find, review]
    if: always() && github.repository == 'OpenIslet/automated-reviewer' && (needs.find.outputs.work == 'true' || github.event_name == 'workflow_dispatch' || github.event.schedule == '47 3 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned dependencies
        run: python -m pip install --require-hashes -r settings/requirements.lock
      - name: Fetch the saved results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: results
      - name: Write the log and rebuild the scoreboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATED_REVIEWER_ENABLED: ${{ vars.AUTOMATED_REVIEWER_ENABLED }}
        # Both commands always run. If either fails, the step fails after both have been tried.
        run: |
          status=0
          if [ -f results.json ]; then python scripts/automated_reviewer.py publish --in results.json || status=1; fi
          python scripts/automated_reviewer.py scoreboard --out scoreboard.json || status=1
          exit $status
      - name: Keep the scoreboard's numbers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoreboard
          path: scoreboard.json
          if-no-files-found: ignore
          retention-days: 90
