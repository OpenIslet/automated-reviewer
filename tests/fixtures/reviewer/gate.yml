# Made-up submissions for the gate. None of them was ever sent to the project, and none is ever opened as an issue.
#
# kind: junk        should be flagged as spam (expect_spam: true)
# kind: borderline  weak, short or clumsy, and still a good-faith proposal (expect_spam: false)
# kind: direct      typed straight into GitHub, without the template. The script leaves these out before any model
#                   is asked, so what is checked is that it does (expect: unparsed).
#
# The submission backend already refuses anything with no template, no sign-in or no passing blind review. So these
# concentrate on what can still get through: text that fits the template and says nothing, and off-topic material
# dressed as a proposal.

- id: junk-advert-watches
  kind: junk
  expect_spam: true
  title: Best replica watches free shipping
  draft: |
    Type: Improvement
    Claim in one sentence: Our store has the best replica watches at the lowest prices with free shipping worldwide.
    In plain English: Buy now.

    ## Evidence

    Thousands of happy customers. Visit our store today.

    ## What I propose changing

    Add a link to our store on your front page.

    ## How this could be wrong

    It cannot be wrong.

    ## Cheapest way to check it

    Order one.

