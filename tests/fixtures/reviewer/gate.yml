  title: Honest review of the new phone
  draft: |
    Type: Problem found
    Claim in one sentence: The new phone has a better camera and a worse battery than last year's model.
    In plain English: Good camera, weak battery.

    ## Evidence

    I used it for a week. It needed charging by mid afternoon every day.

    ## What I propose changing

    Wait for the price to drop before buying one.

    ## How this could be wrong

    I may use my phone more than most people.

    ## Cheapest way to check it

    Borrow one from a friend for a day.

- id: borderline-short-question
  kind: borderline
  expect_spam: false
  title: Is one assay enough for Signal X?
  draft: |
    Type: Problem found
    Claim in one sentence: Test 3 relies on a single assay for Signal X and that may not be enough.
    In plain English: One test might not be enough.

    ## Evidence

    I have no paper for this. In my own lab work single assays have misled us more than once.

    ## What I propose changing

    Add a second, different assay for Signal X in Test 3.

    ## How this could be wrong

    The first assay may already be very reliable for this signal.

    ## Cheapest way to check it

    Run both assays once on the same samples.

- id: borderline-clumsy-english
  kind: borderline
  expect_spam: false
  title: Control group missing in test two
  draft: |
    Type: Problem found
    Claim in one sentence: In test two I not find control group without treatment, so result is hard to compare.
    In plain English: Need a group with no treatment to compare.

    ## Evidence

    I read the test two section three times. Only treated groups are written there.

    ## What I propose changing

    Please add one group that get nothing, same time, same measure.

    ## How this could be wrong

    Maybe control is written in other document and I miss it.

    ## Cheapest way to check it

    Look in the playbook for the control group of test two.

- id: borderline-patient-view
  kind: borderline
  expect_spam: false
  title: Say how often people would need checks afterwards
  draft: |
    Type: Improvement
    Claim in one sentence: The roadmap does not say how often a treated person would need check-ups, and families will ask.
    In plain English: Tell patients how many check-ups to expect.

    ## Evidence

    I am a parent of a child with type 1. Every family I know asks this first about any new treatment.

    ## What I propose changing

    Add a plain sentence to the first human trial stage about the follow-up schedule being planned.

    ## How this could be wrong

    It may be too early to know the schedule.

    ## Cheapest way to check it

    Ask three families what they would want to know.

- id: borderline-no-evidence-critique
  kind: borderline
  expect_spam: false
  title: Design A looks harder to make than Design B
  draft: |
    Type: Problem found
    Claim in one sentence: Design A seems to need more manufacturing steps than Design B, which could slow everything down.
    In plain English: Design A may be slower to make.

    ## Evidence

    This is my reading of the two design descriptions. I have not found a study that compares them.

    ## What I propose changing

    Add a count of manufacturing steps for each design, side by side.

    ## How this could be wrong

    I may have miscounted, or the steps may not take equal time.

    ## Cheapest way to check it

    Count the steps in each design description.

- id: borderline-probably-known
  kind: borderline
  expect_spam: false
  title: Repeat Test 1 in a second lab
  draft: |
    Type: Improvement
    Claim in one sentence: Test 1 should be repeated in a second, independent lab before its result is relied on.
    In plain English: Have another lab repeat the first test.

    ## Evidence

    Results that are repeated elsewhere are trusted more. I expect this is already planned but could not find it.

    ## What I propose changing

    State in Test 1 that an independent repeat is required.

    ## How this could be wrong

    It may already be in the playbook.

    ## Cheapest way to check it

    Search the playbook for an independent repeat of Test 1.

- id: borderline-roadmap-wording
  kind: borderline
  expect_spam: false
  title: Stage 2 title is hard to understand
  draft: |
    Type: Improvement
    Claim in one sentence: The title of roadmap Stage 2 uses a term most patients will not know.
    In plain English: Use simpler words in the Stage 2 title.

    ## Evidence

    I showed the roadmap to two relatives. Neither could say what Stage 2 was for.

    ## What I propose changing

    Rename Stage 2 in plain words and keep the technical term in the text underneath.

    ## How this could be wrong

    Two people is a small sample.

    ## Cheapest way to check it

    Ask five people outside the field to explain the stage back to you.

- id: borderline-wrong-but-sincere
  kind: borderline
  expect_spam: false
  title: Skip Test 4 to save time
  draft: |
    Type: Improvement
    Claim in one sentence: Test 4 repeats what Test 3 already shows, so it could be skipped.
    In plain English: Test 4 may be unnecessary.

    ## Evidence

    Both tests measure Signal X after the same treatment, as far as I can tell from the summaries.

    ## What I propose changing

    Remove Test 4, or explain what it adds beyond Test 3.

    ## How this could be wrong

    The two tests may measure different things that only look alike in the summary.

    ## Cheapest way to check it

    Compare the readouts listed for Test 3 and Test 4.

- id: borderline-angry-but-on-topic
  kind: borderline
  expect_spam: false
  title: The odds section is far too optimistic
  draft: |
    Type: Problem found
    Claim in one sentence: The odds given for Test 5 are much too optimistic and frankly irresponsible.
    In plain English: The stated chance of success is too high.

    ## Evidence

    Most first attempts at anything this hard fail. The page gives no reason why this one would be different.

    ## What I propose changing

    Lower the stated odds for Test 5, or show the reasoning behind the number.

    ## How this could be wrong

    There may be reasoning I have not found.

    ## Cheapest way to check it

    Publish how the number for Test 5 was worked out.

